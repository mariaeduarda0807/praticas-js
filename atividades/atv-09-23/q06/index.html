<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <h1>Questão 6</h1>

    <p>
        Escreva um programa para calcular a nota final de um aluno de curso técnico
        subsequente do IFCE, sabendo que o semestre letivo é dividido em 2 etapas
        (N1 e N2) e a nota final é obtida a partir de uma média ponderada.
    </p>

    <form id="formDados">
        <label for="n1">Nota N1:</label>
        <input type="number" step="0.01" id="n1"/>

        <label for="n2">Nota N2:</label>
        <input type="number" step="0.01" id="n2"/>

        <button type="submit">Calcular nota final</button>
    </form>

    <p id="resultado"></p>

</body>
</html>
