<body>
    <h1>Questão 01</h1>
<p>
        Escreva um programa que leia um valor em R$ (reais) e converta-o para US$ (dólar americano).Use a cotação atual dólar.
</p>

    <form id="formDados">
        <label for="valorReais">Valor em R$ (reais):</label>
        <input type="number" step="0.01" min="0.01" id="valorReais"/>

<button type="submit">Converter para dólar</button>
</form>

<p id="resultado"></p>

</body>
