<body>
    <h1>Questão 5</h1>
    <p>
    Escreva um programa que calcule o salário de um professor baseado no valor da hora-aula e da quantidade de
    horas trabalhadas, obtidas a partir do teclado.
    </p>

    <form id="formDados">
    <label for="hora">Valor da hora-aula:</label>
    <input type="number" step="0.01" id="hora"/>

        <label for="htrabalhadas">quantidade de horas trabalhadas:</label>
    <input type="number" step="0.01" id="htrabalhadas"/>

    <button type="submit">Calcular salário </button>
    </form>

    <p id="resultado"></p>

</body>
